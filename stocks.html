<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 주식 리포트 자동화 페이지</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem; }
    h1, h2, h3 { text-align: center; }
    section { margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    .portfolio-group { margin-bottom: 2rem; }
    .portfolio-group table { margin: 0 auto; }
  </style>
</head>
<body>
  <h1>데일리 주식 리포트 자동화</h1>

  <section id="marketData">
    <h2>오늘의 마켓 스냅샷</h2>
    <table>
      <thead>
        <tr><th>지수</th><th>현재가</th><th>등락(%)</th></tr>
      </thead>
      <tbody id="marketBody">
        <tr><td colspan="3">로딩 중...</td></tr>
      </tbody>
    </table>
  </section>

  <section id="reports">
    <h2>안정형 포트폴리오 추천</h2>
    <div id="stablePortfolio" class="portfolio-group"><p>로딩 중...</p></div>

    <h2>공격형 포트폴리오 추천</h2>
    <div id="aggressivePortfolio" class="portfolio-group"><p>로딩 중...</p></div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await fetchMarketIndices();
      await fetchPortfolioRecommendations();
    });

    async function fetchMarketIndices() {
      const symbols = [
        { name: 'KOSPI', symbol: '%5EKS11' },
        { name: 'KOSDAQ', symbol: '%5EKQ11' },
        { name: 'S&P500', symbol: '%5EGSPC' },
        { name: 'NASDAQ', symbol: '%5EIXIC' }
      ];
      const tbody = document.getElementById('marketBody');
      tbody.innerHTML = '';

      for (const idx of symbols) {
        try {
          const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${idx.symbol}`);
          const data = await res.json();
          const meta = data.chart.result[0].meta;
          const price = meta.regularMarketPrice.toFixed(2);
          const prev = meta.chartPreviousClose;
          const changePct = (((meta.regularMarketPrice - prev) / prev) * 100).toFixed(2);

          const row = document.createElement('tr');
          row.innerHTML = `<td>${idx.name}</td><td>${price}</td><td>${changePct}%</td>`;
          tbody.appendChild(row);
        } catch (err) {
          console.error(err);
        }
      }
    }

    async function fetchPortfolioRecommendations() {
      const stableList = [
        { market: '국내', ticker: '005930.KS', name: '삼성전자' },
        { market: '국내', ticker: '000660.KS', name: 'SK하이닉스' },
        { market: '국내', ticker: '005380.KS', name: '현대자동차' },
        { market: '미국', ticker: 'AAPL', name: 'Apple' },
        { market: '미국', ticker: 'MSFT', name: 'Microsoft' }
      ];

      const aggressiveList = [
        { market: '국내', ticker: '035720.KS', name: '카카오' },
        { market: '국내', ticker: '035420.KS', name: '네이버' },
        { market: '미국', ticker: 'TSLA', name: 'Tesla' },
        { market: '미국', ticker: 'NVDA', name: 'NVIDIA' },
        { market: '미국', ticker: 'AMZN', name: 'Amazon' }
      ];

      const stableDiv = document.getElementById('stablePortfolio');
      const aggrDiv = document.getElementById('aggressivePortfolio');

      stableDiv.innerHTML = '<p>로딩 중...</p>';
      aggrDiv.innerHTML = '<p>로딩 중...</p>';

      const stableData = await Promise.all(stableList.map(async item => {
        const metrics = await fetchTickerMetrics(item.ticker);
        return { ...item, metrics };
      }));

      const aggressiveData = await Promise.all(aggressiveList.map(async item => {
        const metrics = await fetchTickerMetrics(item.ticker);
        return { ...item, metrics };
      }));

      stableDiv.innerHTML = generateTableHTML(stableData);
      aggrDiv.innerHTML = generateTableHTML(aggressiveData);
    }

    async function fetchTickerMetrics(ticker) {
      try {
        const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=summaryDetail,financialData`;
        const res = await fetch(url);
        const json = await res.json();
        const result = json.quoteSummary.result[0];
        const summary = result.summaryDetail;
        const fin = result.financialData;
        return {
          pe: summary.trailingPE?.raw?.toFixed(2) || 'N/A',
          pb: summary.priceToBook?.raw?.toFixed(2) || 'N/A',
          dividendYield: fin.dividendYield?.raw ? (fin.dividendYield.raw * 100).toFixed(2) + '%' : 'N/A'
        };
      } catch (e) {
        console.error(e);
        return { pe: 'N/A', pb: 'N/A', dividendYield: 'N/A' };
      }
    }

    function generateTableHTML(list) {
      return `
        <table>
          <thead>
            <tr>
              <th>종목</th>
              <th>PER</th>
              <th>PBR</th>
              <th>배당수익률</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(item => `
              <tr>
                <td>${item.name} (${item.ticker})</td>
                <td>${item.metrics.pe}</td>
                <td>${item.metrics.pb}</td>
                <td>${item.metrics.dividendYield}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
