<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stock Recommendations</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    h1, h2, h3 { margin-top: 1.5rem; }
    ul { list-style: disc inside; padding-left: 0; }
    li { margin: 0.3rem 0; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Live Stock Recommendations</h1>
  <div id="status">Loading…</div>
  <div id="content"></div>

  <script>
    // 1) Your Web App endpoint
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwhgArNymgUf-osMztvh348yzxX8HuKAqE4FVt4sQyPE_5Rn7hXy5vtg0u3n7jjrvttxQ/exec';

    // 2) Fetch the JSON and call render()
    async function fetchRecs() {
      const statusEl = document.getElementById('status');
      try {
        const url = ENDPOINT + '?_=' + Date.now();   // cache-buster
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        statusEl.textContent = '';                  // clear "Loading…"
        render(data);
      } catch (err) {
        statusEl.textContent = 'Error loading data';
        statusEl.classList.add('error');
        console.error(err);
      }
    }

    // 3) Render the fetched data into the page
    function render(data) {
      const container = document.getElementById('content');
      container.innerHTML = `<p><em>Last updated:</em> ${new Date(data.lastUpdated).toLocaleString()}</p>`;

      ['KOSPI','KOSDAQ','NASDAQ','NYSE'].forEach(market => {
        if (!data[market]) return;
        const sec = document.createElement('section');
        sec.innerHTML = `<h2>${market}</h2>`;

        ['safe','aggressive'].forEach(bucket => {
          const list = document.createElement('ul');
          const header = document.createElement('h3');
          header.textContent = bucket.toUpperCase();
          sec.appendChild(header);

          (data[market][bucket] || []).forEach(item => {
            const li = document.createElement('li');
            li.textContent = `${item.name} — ${item.sector || 'N/A'} @ ${item.prevClose ?? '–'}`;
            list.appendChild(li);
          });

          sec.appendChild(list);
        });

        container.appendChild(sec);
      });
    }

    // 4) Run on page load
    window.addEventListener('DOMContentLoaded', fetchRecs);
  </script>
</body>
</html>
