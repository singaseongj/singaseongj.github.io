<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Portfolio</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; line-height: 1.6; }
    h1 { text-align: center; }
    section { margin-top: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #eee; }
    .visit { text-align: center; margin-top: 20px; color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
<h1>Stock Portfolio Recommendations</h1>
<div id="content">Loading...</div>
<div id="visit" class="visit"></div>
<script>
async function loadData() {
  try {
    const res = await fetch('recommendations.json');
    const data = await res.json();
    const markets = ['KOSPI','KOSDAQ','NASDAQ','NYSE'];
    let html = '';
    for (const m of markets) {
      const info = data[m];
      if (!info) continue;
      html += `<section><h2>${m}</h2>`;
      html += '<table><tr><th colspan="2">Safe</th></tr>';
      info.safe.forEach(item => { html += `<tr><td>${item.name}</td><td>${item.sector ?? ''}</td></tr>`; });
      html += '<tr><th colspan="2">Aggressive</th></tr>';
      info.aggressive.forEach(item => { html += `<tr><td>${item.name}</td><td>${item.sector ?? ''}</td></tr>`; });
      html += '</table></section>';
    }
    document.getElementById('content').innerHTML = html;
  } catch (err) {
    document.getElementById('content').textContent = 'Failed to load data.';
  }
}

async function loadVisits() {
  try {
    const res = await fetch('https://script.google.com/macros/s/AKfycbyM94HyV7c_eqq3SPLMZlBcJVh6KeyygmR4bq_NM80_li9MIM2WWQ25wnd3S51FR4igLw/exec?page=stocks');
    const data = await res.json();
    document.getElementById('visit').textContent = `Visits today: ${data.daily} | Total: ${data.total}`;
  } catch (err) {
    console.error('Visit count failed', err);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  loadData();
  loadVisits();
});
</script>
</body>
</html>
