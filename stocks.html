<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 주식 리포트 자동화 페이지</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem; }
    h1, h2, h3 { text-align: center; }
    section { margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    .portfolio-group { margin-bottom: 2rem; }
    .portfolio-group table { margin: 0 auto; }
  </style>
</head>
<body>
  <h1>데일리 주식 리포트 자동화</h1>

  <section id="marketData">
    <h2>오늘의 마켓 스냅샷</h2>
    <table>
      <thead>
        <tr><th>지수</th><th>현재가</th><th>등락(%)</th></tr>
      </thead>
      <tbody id="marketBody">
        <tr><td colspan="3">로딩 중...</td></tr>
      </tbody>
    </table>
  </section>

  <section id="reports">
    <h2>포트폴리오 추천</h2>
    <div class="portfolio-group">
      <h3>국내 안정형</h3>
      <div id="domesticStable">로딩 중...</div>
    </div>
    <div class="portfolio-group">
      <h3>국내 공격형</h3>
      <div id="domesticAggressive">로딩 중...</div>
    </div>
    <div class="portfolio-group">
      <h3>미국 안정형</h3>
      <div id="usStable">로딩 중...</div>
    </div>
    <div class="portfolio-group">
      <h3>미국 공격형</h3>
      <div id="usAggressive">로딩 중...</div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await fetchMarketIndices();
      await fetchPortfolioRecommendations();
    });

    async function fetchMarketIndices() {
      const symbols = [
        { name: 'KOSPI', symbol: '%5EKS11' },
        { name: 'KOSDAQ', symbol: '%5EKQ11' },
        { name: 'S&P500', symbol: '%5EGSPC' },
        { name: 'NASDAQ', symbol: '%5EIXIC' }
      ];
      const tbody = document.getElementById('marketBody');
      tbody.innerHTML = '';

      for (const idx of symbols) {
        try {
          const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${idx.symbol}`);
          const data = await res.json();
          const meta = data.chart.result[0].meta;
          const price = meta.regularMarketPrice.toFixed(2);
          const prev = meta.chartPreviousClose;
          const changePct = (((meta.regularMarketPrice - prev) / prev) * 100).toFixed(2);

          const row = document.createElement('tr');
          row.innerHTML = `<td>${idx.name}</td><td>${price}</td><td>${changePct}%</td>`;
          tbody.appendChild(row);
        } catch (err) {
          console.error(err);
        }
      }
    }

    async function fetchPortfolioRecommendations() {
      const domesticStableList = [
        { ticker: '005930.KS', name: '삼성전자' },
        { ticker: '000660.KS', name: 'SK하이닉스' },
        { ticker: '005380.KS', name: '현대자동차' },
        { ticker: '051910.KS', name: 'LG화학' },
        { ticker: '017670.KS', name: 'SK텔레콤' }
      ];
      const domesticAggressiveList = [
        { ticker: '035720.KS', name: '카카오' },
        { ticker: '035420.KS', name: '네이버' },
        { ticker: '068270.KS', name: '셀트리온' },
        { ticker: '095570.KS', name: 'SK이노베이션' },
        { ticker: '000270.KS', name: '기아' }
      ];
      const usStableList = [
        { ticker: 'AAPL', name: 'Apple' },
        { ticker: 'MSFT', name: 'Microsoft' },
        { ticker: 'JNJ', name: 'Johnson & Johnson' },
        { ticker: 'PG', name: 'Procter & Gamble' },
        { ticker: 'KO', name: 'Coca-Cola' }
      ];
      const usAggressiveList = [
        { ticker: 'TSLA', name: 'Tesla' },
        { ticker: 'NVDA', name: 'NVIDIA' },
        { ticker: 'AMZN', name: 'Amazon' },
        { ticker: 'FB', name: 'Meta Platforms' },
        { ticker: 'ROKU', name: 'Roku' }
      ];

      const groups = [
        { id: 'domesticStable', list: domesticStableList },
        { id: 'domesticAggressive', list: domesticAggressiveList },
        { id: 'usStable', list: usStableList },
        { id: 'usAggressive', list: usAggressiveList }
      ];

      for (const group of groups) {
        const container = document.getElementById(group.id);
        container.innerHTML = '<p>로딩 중...</p>';
        const data = await Promise.all(group.list.map(async item => {
          const metrics = await fetchTickerMetrics(item.ticker);
          return { ...item, metrics };
        }));
        container.innerHTML = generateTableHTML(data);
      }
    }

    async function fetchTickerMetrics(ticker) {
      try {
        const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=summaryDetail,financialData`;
        const res = await fetch(url);
        const json = await res.json();
        const result = json.quoteSummary.result[0];
        const summary = result.summaryDetail;
        const fin = result.financialData;
        return {
          pe: summary.trailingPE?.raw?.toFixed(2) || 'N/A',
          pb: summary.priceToBook?.raw?.toFixed(2) || 'N/A',
          dividendYield: fin.dividendYield?.raw ? (fin.dividendYield.raw * 100).toFixed(2) + '%' : 'N/A'
        };
      } catch (e) {
        console.error(e);
        return { pe: 'N/A', pb: 'N/A', dividendYield: 'N/A' };
      }
    }

    function generateTableHTML(list) {
      return `
        <table>
          <thead>
            <tr>
              <th>종목</th>
              <th>PER</th>
              <th>PBR</th>
              <th>배당수익률</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(item => `
              <tr>
                <td>${item.name} (${item.ticker})</td>
                <td>${item.metrics.pe}</td>
                <td>${item.metrics.pb}</td>
                <td>${item.metrics.dividendYield}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
