<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Portfolio Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #111827;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            margin-bottom: 32px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-label {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 4px;
        }

        .card-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .icon {
            width: 32px;
            height: 32px;
        }

        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
        }

        .select {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 8px 16px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-container {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 24px;
        }

        .chart-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .market-section {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .market-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .market-header:hover {
            background-color: #374151;
        }

        .market-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .market-name {
            font-size: 1.125rem;
            font-weight: bold;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.875rem;
        }

        .badge-safe {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .badge-aggressive {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .market-content {
            padding: 0 16px 16px;
            display: none;
        }

        .market-content.expanded {
            display: block;
        }

        .stocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 16px;
        }

        .stock-category {
            margin-bottom: 16px;
        }

        .category-title {
            font-size: 0.875rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stock-item {
            background-color: #111827;
            padding: 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stock-symbol {
            font-weight: 500;
        }

        .stock-name {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-left: 8px;
        }

        .beta-value {
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .beta-number {
            font-weight: 500;
            margin-left: 4px;
        }

        .beta-safe {
            color: #10b981;
        }

        .beta-aggressive {
            color: #ef4444;
        }

        .legend {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 16px;
            margin-top: 32px;
        }

        .legend-content {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .legend-detail {
            margin-top: 8px;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .chevron {
            transition: transform 0.2s;
        }

        .chevron.expanded {
            transform: rotate(180deg);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 1.5rem;
        }

        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="loading">Loading portfolio data...</div>
    </div>

    <script>
        let portfolioData = null;
        let pieChart = null;
        let barChart = null;

        // Load data from Google Apps Script
        async function loadData() {
            const LOCAL_URL = 'recommendations.json';
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwhgArNymgUf-osMztvh348yzxX8HuKAqE4FVt4sQyPE_5Rn7hXy5vtg0u3n7jjrvttxQ/exec';
            const DRIVE_URL = 'https://drive.google.com/uc?export=download&id=1OE6OGkhextQCBRG_jG3TC05LdV6RKRHZ';
            try {
                const localRes = await fetch(LOCAL_URL);
                if (!localRes.ok) throw new Error('Local file not found');
                portfolioData = await localRes.json();
                initializeDashboard();
            } catch (errLocal) {
                console.warn('Local fetch failed, trying script', errLocal);
                try {
                    const res = await fetch(SCRIPT_URL);
                    if (!res.ok) throw new Error('Network response was not ok');
                    portfolioData = await res.json();
                    initializeDashboard();
                } catch (error) {
                    console.warn('Script fetch failed, trying Drive fallback', error);
                    try {
                        const driveRes = await fetch(DRIVE_URL);
                        if (!driveRes.ok) throw new Error('Drive file not found');
                        portfolioData = await driveRes.json();
                        initializeDashboard();
                    } catch (err2) {
                        console.error('Error loading data:', err2);
                        document.getElementById('app').innerHTML = '<div class="loading error">Error loading portfolio data</div>';
                    }
                }
            }
        }

        function initializeDashboard() {
            const app = document.getElementById('app');
            
            // Process data
            const { allStocks, marketDistribution, riskDistribution } = processData();
            
            // Build HTML
            app.innerHTML = `
                <div class="header">
                    <h1 class="title">Investment Portfolio Dashboard</h1>
                    <p class="subtitle">Last updated: ${new Date(portfolioData.lastUpdated).toLocaleString()}</p>
                </div>

                <div class="summary-grid">
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <p class="card-label">Total Stocks</p>
                                <p class="card-value">${allStocks.length}</p>
                            </div>
                            <svg class="icon" fill="#3b82f6" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <p class="card-label">Safe Stocks</p>
                                <p class="card-value" style="color: #10b981;">${riskDistribution.safe}</p>
                            </div>
                            <svg class="icon" fill="#10b981" viewBox="0 0 24 24">
                                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <p class="card-label">Aggressive Stocks</p>
                                <p class="card-value" style="color: #ef4444;">${riskDistribution.aggressive}</p>
                            </div>
                            <svg class="icon" fill="#ef4444" viewBox="0 0 24 24">
                                <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                            </svg>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <p class="card-label">Markets</p>
                                <p class="card-value">${marketDistribution.length}</p>
                            </div>
                            <svg class="icon" fill="#a78bfa" viewBox="0 0 24 24">
                                <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="filters">
                    <select class="select" id="marketFilter" onchange="updateCharts()">
                        <option value="all">All Markets</option>
                        <option value="NASDAQ">NASDAQ</option>
                        <option value="NYSE">NYSE</option>
                        <option value="KOSPI">KOSPI</option>
                        <option value="KOSDAQ">KOSDAQ</option>
                    </select>
                    
                    <select class="select" id="riskFilter" onchange="updateCharts()">
                        <option value="all">All Risk Levels</option>
                        <option value="safe">Safe Only</option>
                        <option value="aggressive">Aggressive Only</option>
                    </select>
                </div>

                <div class="charts-grid">
                    <div class="chart-container">
                        <h2 class="chart-title">Market Distribution</h2>
                        <canvas id="pieChart" width="400" height="300"></canvas>
                    </div>
                    
                    <div class="chart-container">
                        <h2 class="chart-title">Beta Distribution</h2>
                        <canvas id="barChart" width="400" height="300"></canvas>
                    </div>
                </div>

                <div id="marketSections"></div>

                <div class="legend">
                    <div class="legend-content">
                        <svg width="16" height="16" fill="#fbbf24" viewBox="0 0 24 24">
                            <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                        </svg>
                        <span>Beta (β) measures volatility relative to the market:</span>
                    </div>
                    <div class="legend-detail">
                        <span class="beta-safe">β < 1.0</span> = Less volatile (safer) | 
                        <span class="beta-aggressive" style="margin-left: 8px;">β > 1.0</span> = More volatile (aggressive)
                    </div>
                </div>
            `;

            // Initialize charts
            initializeCharts(marketDistribution);
            
            // Build market sections
            buildMarketSections();
            
            // Update charts with initial data
            updateCharts();
        }

        function processData() {
            const markets = ['NASDAQ', 'NYSE', 'KOSPI', 'KOSDAQ'];
            let allStocks = [];
            let marketDistribution = [];
            let riskDistribution = { safe: 0, aggressive: 0 };

            markets.forEach(market => {
                if (portfolioData[market]) {
                    const safeStocks = portfolioData[market].safe || [];
                    const aggressiveStocks = portfolioData[market].aggressive || [];
                    
                    marketDistribution.push({
                        name: market,
                        value: safeStocks.length + aggressiveStocks.length
                    });

                    riskDistribution.safe += safeStocks.length;
                    riskDistribution.aggressive += aggressiveStocks.length;

                    safeStocks.forEach(stock => {
                        allStocks.push({ ...stock, market, risk: 'safe' });
                    });
                    aggressiveStocks.forEach(stock => {
                        allStocks.push({ ...stock, market, risk: 'aggressive' });
                    });
                }
            });

            return { allStocks, marketDistribution, riskDistribution };
        }

        function initializeCharts(marketDistribution) {
            // Pie Chart
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            pieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: marketDistribution.map(d => d.name),
                    datasets: [{
                        data: marketDistribution.map(d => d.value),
                        backgroundColor: ['#0088FE', '#00C49F', '#FFBB28', '#FF8042'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#fff',
                                padding: 20
                            }
                        }
                    }
                }
            });

            // Bar Chart (will be updated by updateCharts)
            const barCtx = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['0.0-0.5', '0.5-0.8', '0.8-1.0', '1.0-1.2', '1.2-1.5', '1.5+'],
                    datasets: [{
                        label: 'Number of Stocks',
                        data: [0, 0, 0, 0, 0, 0],
                        backgroundColor: ['#00C49F', '#00C49F', '#00C49F', '#FF6B6B', '#FF6B6B', '#FF6B6B'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: '#374151'
                            },
                            ticks: {
                                color: '#9CA3AF'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#9CA3AF'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        function updateCharts() {
            const marketFilter = document.getElementById('marketFilter').value;
            const riskFilter = document.getElementById('riskFilter').value;
            
            const { allStocks } = processData();
            
            // Filter stocks
            const filteredStocks = allStocks.filter(stock => {
                const marketMatch = marketFilter === 'all' || stock.market === marketFilter;
                const riskMatch = riskFilter === 'all' || stock.risk === riskFilter;
                return marketMatch && riskMatch;
            });

            // Update bar chart
            const betaCounts = [0, 0, 0, 0, 0, 0];
            filteredStocks.forEach(stock => {
                const beta = stock.beta;
                if (beta < 0.5) betaCounts[0]++;
                else if (beta < 0.8) betaCounts[1]++;
                else if (beta < 1.0) betaCounts[2]++;
                else if (beta < 1.2) betaCounts[3]++;
                else if (beta < 1.5) betaCounts[4]++;
                else betaCounts[5]++;
            });

            barChart.data.datasets[0].data = betaCounts;
            barChart.update();
        }

        function buildMarketSections() {
            const container = document.getElementById('marketSections');
            const markets = ['NASDAQ', 'NYSE', 'KOSPI', 'KOSDAQ'];
            const colors = {
                NASDAQ: '#0088FE',
                NYSE: '#00C49F',
                KOSPI: '#FFBB28',
                KOSDAQ: '#FF8042'
            };

            markets.forEach(market => {
                const marketData = portfolioData[market];
                if (!marketData) return;

                const safeStocks = marketData.safe || [];
                const aggressiveStocks = marketData.aggressive || [];

                const section = document.createElement('div');
                section.className = 'market-section';
                section.innerHTML = `
                    <div class="market-header" onclick="toggleMarket('${market}')">
                        <div class="market-info">
                            <h3 class="market-name" style="color: ${colors[market]}">${market}</h3>
                            <div style="display: flex; gap: 8px;">
                                <span class="badge badge-safe">Safe: ${safeStocks.length}</span>
                                <span class="badge badge-aggressive">Aggressive: ${aggressiveStocks.length}</span>
                            </div>
                        </div>
                        <svg class="chevron" id="chevron-${market}" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                        </svg>
                    </div>
                    <div class="market-content" id="content-${market}">
                        <div class="stocks-grid">
                            <div class="stock-category">
                                <h4 class="category-title beta-safe">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                                    </svg>
                                    Safe Stocks
                                </h4>
                                ${safeStocks.map(stock => `
                                    <div class="stock-item">
                                        <div>
                                            <span class="stock-symbol">${stock.symbol}</span>
                                            <span class="stock-name">${stock.name}</span>
                                        </div>
                                        <div>
                                            <span class="beta-value">β:</span>
                                            <span class="beta-number beta-safe">${stock.beta.toFixed(3)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="stock-category">
                                <h4 class="category-title beta-aggressive">
                                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                                    </svg>
                                    Aggressive Stocks
                                </h4>
                                ${aggressiveStocks.map(stock => `
                                    <div class="stock-item">
                                        <div>
                                            <span class="stock-symbol">${stock.symbol}</span>
                                            <span class="stock-name">${stock.name}</span>
                                        </div>
                                        <div>
                                            <span class="beta-value">β:</span>
                                            <span class="beta-number beta-aggressive">${stock.beta.toFixed(3)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function toggleMarket(market) {
            const content = document.getElementById(`content-${market}`);
            const chevron = document.getElementById(`chevron-${market}`);
            
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                chevron.classList.remove('expanded');
            } else {
                content.classList.add('expanded');
                chevron.classList.add('expanded');
            }
        }

        // Initialize on load
        loadData();
</script>
<div id="visitCounts" style="text-align:center;margin-top:20px;font-size:0.8rem;color:#64748b;"></div>
<script>
  (async function() {
    try {
      const res = await fetch('https://script.google.com/macros/s/AKfycbyM94HyV7c_eqq3SPLMZlBcJVh6KeyygmR4bq_NM80_li9MIM2WWQ25wnd3S51FR4igLw/exec?page=stocks');
      const data = await res.json();
      document.getElementById('visitCounts').textContent = `Visits today: ${data.daily} | Total: ${data.total}`;
    } catch (err) {
      console.error('Visit count failed', err);
    }
  })();
</script>
</body>
</html>
