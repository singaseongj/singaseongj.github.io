<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 주식 리포트 자동화 페이지</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem; }
    h1, h2, h3 { text-align: center; }
    section { margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    .portfolio-group { margin-bottom: 2rem; }
    .portfolio-group table { margin: 0 auto; }
    .loading { text-align: center; color: #666; }
  </style>
</head>
<body>
  <h1>데일리 주식 리포트 자동화</h1>

  <section id="marketData">
    <h2>오늘의 마켓 스냅샷</h2>
    <table>
      <thead>
        <tr><th>지수</th><th>현재가</th><th>등락(%)</th></tr>
      </thead>
      <tbody id="marketBody">
        <tr><td colspan="3" class="loading">로딩 중...</td></tr>
      </tbody>
    </table>
  </section>

  <section id="reports">
    <h2>포트폴리오 추천</h2>
    <div class="portfolio-group">
      <h3>국내 안정형 (Stable Domestic)</h3>
      <div id="domesticStable"><p class="loading">로딩 중...</p></div>
    </div>
    <div class="portfolio-group">
      <h3>국내 공격형 (Aggressive Domestic)</h3>
      <div id="domesticAggressive"><p class="loading">로딩 중...</p></div>
    </div>
    <div class="portfolio-group">
      <h3>미국 안정형 (Stable US)</h3>
      <div id="usStable"><p class="loading">로딩 중...</p></div>
    </div>
    <div class="portfolio-group">
      <h3>미국 공격형 (Aggressive US)</h3>
      <div id="usAggressive"><p class="loading">로딩 중...</p></div>
    </div>
  </section>

  <script>
    // Financial Modeling Prep API 설정 (무료 API 키 필요)
    const FMP_API_KEY = 'YOUR_FMP_API_KEY';

    document.addEventListener('DOMContentLoaded', async () => {
      await fetchMarketIndices();
      await fetchPortfolioRecommendations();
    });

    // 시장 지수 데이터 조회 (Yahoo Finance)
    async function fetchMarketIndices() {
      const symbols = [
        { name: 'KOSPI', symbol: '%5EKS11' },
        { name: 'KOSDAQ', symbol: '%5EKQ11' },
        { name: 'S&P500', symbol: '%5EGSPC' },
        { name: 'NASDAQ', symbol: '%5EIXIC' }
      ];
      const tbody = document.getElementById('marketBody');
      tbody.innerHTML = '';

      for (const idx of symbols) {
        try {
          const res = await fetch(
            `https://query1.finance.yahoo.com/v8/finance/chart/${idx.symbol}`
          );
          const data = await res.json();
          const meta = data.chart.result[0].meta;
          const price = meta.regularMarketPrice.toFixed(2);
          const prev = meta.chartPreviousClose;
          const changePct = (((meta.regularMarketPrice - prev) / prev) * 100).toFixed(2);

          const row = document.createElement('tr');
          row.innerHTML = `<td>${idx.name}</td><td>${price}</td><td>${changePct}%</td>`;
          tbody.appendChild(row);
        } catch (err) {
          console.error(err);
        }
      }
    }

    // 포트폴리오 추천: 백엔드 스크리너 API 호출
    async function fetchPortfolioRecommendations() {
      const groupsConfig = [
        { id: 'domesticStable', exchange: 'KRX', type: 'stable' },
        { id: 'domesticAggressive', exchange: 'KRX', type: 'aggressive' },
        { id: 'usStable', exchange: 'NASDAQ', type: 'stable' },
        { id: 'usAggressive', exchange: 'NASDAQ', type: 'aggressive' }
      ];

      for (const group of groupsConfig) {
        const container = document.getElementById(group.id);
        container.innerHTML = `<p class="loading">로딩 중...</p>`;
        try {
          const list = await fetchScreener(group.exchange, group.type);
          const data = await Promise.all(
            list.map(async item => {
              // 스크리너 결과의 symbol, companyName 사용
              const metrics = await fetchTickerMetrics(item.symbol);
              return {
                name: item.companyName || item.symbol,
                ticker: item.symbol,
                metrics
              };
            })
          );
          container.innerHTML = generateTableHTML(data);
        } catch (e) {
          console.error(e);
          container.innerHTML = `<p class="loading">데이터 로드 실패</p>`;
        }
      }
    }

    // 스크리너 API 호출: 안정형/공격형 분기
    async function fetchScreener(exchange, type) {
      let url = `https://financialmodelingprep.com/api/v3/stock-screener?` +
        `exchange=${exchange}` +
        `&limit=5` +
        `&apikey=${FMP_API_KEY}`;
      if (type === 'stable') {
        url += `&marketCapMoreThan=100000000000&dividendMoreThan=2`;
      } else {
        url += `&orderBy=changesPercentage&sort=desc`;
      }
      const res = await fetch(url);
      const json = await res.json();
      return json;
    }

    // 개별 종목 지표 조회 (Yahoo Finance)
    async function fetchTickerMetrics(ticker) {
      try {
        const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=summaryDetail,financialData`;
        const res = await fetch(url);
        const json = await res.json();
        const result = json.quoteSummary.result[0];
        const summary = result.summaryDetail;
        const fin = result.financialData;
        return {
          pe: summary.trailingPE?.raw?.toFixed(2) || 'N/A',
          pb: summary.priceToBook?.raw?.toFixed(2) || 'N/A',
          dividendYield: fin.dividendYield?.raw
            ? (fin.dividendYield.raw * 100).toFixed(2) + '%'
            : 'N/A'
        };
      } catch {
        return { pe: 'N/A', pb: 'N/A', dividendYield: 'N/A' };
      }
    }

    // HTML 테이블 생성
    function generateTableHTML(list) {
      return `
        <table>
          <thead>
            <tr>
              <th>종목</th>
              <th>PER</th>
              <th>PBR</th>
              <th>배당수익률</th>
            </tr>
          </thead>
          <tbody>
            ${list
              .map(
                item => `
              <tr>
                <td>${item.name} (${item.ticker})</td>
                <td>${item.metrics.pe}</td>
                <td>${item.metrics.pb}</td>
                <td>${item.metrics.dividendYield}</td>
              </tr>
            `
              )
              .join('')}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
