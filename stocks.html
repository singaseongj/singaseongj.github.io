<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데일리 주식 리포트 자동화 페이지</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem; }
    h1, h2 { text-align: center; }
    #marketData table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    #marketData th, #marketData td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
    #reports { margin-top: 2rem; }
    .btn { margin-top: 1rem; padding: 0.7rem 1.5rem; font-size: 1rem; cursor: pointer; }
    .input-group { margin-bottom: 1rem; }
    label { font-weight: bold; display: block; margin-bottom: 0.3rem; }
    input[type="text"], textarea { width: 100%; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>데일리 주식 리포트 자동화</h1>

  <section id="marketData">
    <h2>오늘의 마켓 스냅샷</h2>
    <table>
      <thead>
        <tr>
          <th>지수</th>
          <th>현재가</th>
          <th>등락(%)</th>
        </tr>
      </thead>
      <tbody id="marketBody">
        <!-- 데이터 로드 중 -->
        <tr><td colspan="3">로딩 중...</td></tr>
      </tbody>
    </table>
  </section>

  <section id="reports">
    <h2>안정형 포트폴리오 추천</h2>
    <div id="stablePortfolio">로딩 중...</div>
    <h2>공격형 포트폴리오 추천</h2>
    <div id="aggressivePortfolio">로딩 중...</div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchMarketIndices();
      fetchPortfolioRecommendations();
    });

    async function fetchMarketIndices() {
      const symbols = [
        { name: 'KOSPI', symbol: '%5EKS11' },
        { name: 'KOSDAQ', symbol: '%5EKQ11' },
        { name: 'S&P500', symbol: '%5EGSPC' },
        { name: 'NASDAQ', symbol: '%5EIXIC' }
      ];
      const tbody = document.getElementById('marketBody');
      tbody.innerHTML = '';

      for (const idx of symbols) {
        try {
          const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${idx.symbol}`);
          const data = await res.json();
          const meta = data.chart.result[0].meta;
          const price = meta.regularMarketPrice.toFixed(2);
          const prev = meta.chartPreviousClose;
          const changePct = (((meta.regularMarketPrice - prev) / prev) * 100).toFixed(2);

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${idx.name}</td>
            <td>${price}</td>
            <td>${changePct}%</td>
          `;
          tbody.appendChild(row);
        } catch (err) {
          console.error(err);
        }
      }
    }

    async function fetchPortfolioRecommendations() {
      // 예시: 서버 또는 외부 API에서 추천 종목 데이터 가져오기
      // 여기서는 더미 데이터로 표시
      const stable = [
        { ticker: '005930.KS', name: '삼성전자', reason: 'PER 8배, 배당수익률 3.5%' },
        { ticker: '000660.KS', name: 'SK하이닉스', reason: '안정적 메모리 수요' }
      ];
      const aggressive = [
        { ticker: '035720.KS', name: '카카오', reason: '플랫폼 성장 모멘텀' },
        { ticker: '000270.KS', name: '기아', reason: '전기차 라인업 확대' }
      ];

      const stableDiv = document.getElementById('stablePortfolio');
      const aggrDiv = document.getElementById('aggressivePortfolio');

      stableDiv.innerHTML = generateListHTML(stable);
      aggrDiv.innerHTML = generateListHTML(aggressive);
    }

    function generateListHTML(list) {
      return '<ul>' + list.map(item => `
        <li><strong>${item.name} (${item.ticker}):</strong> ${item.reason}</li>
      `).join('') + '</ul>';
    }
  </script>
</body>
</html>
