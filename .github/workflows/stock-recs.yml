---
# yamllint disable rule:line-length
name: Build & Publish Stock Recommendations

'on':
  workflow_dispatch:
  schedule:
    # Every 5 hours (cron is UTC; cadence doesn't depend on timezone)
    - cron: '0 */5 * * *'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    environment:
      name: production
      url: https://singaseongj.github.io

    concurrency:
      group: daily-stock-report
      cancel-in-progress: false

    env:
      TZ: Asia/Seoul
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Keep the run under typical 60s shells; script respects this.
      HARD_DEADLINE_MS: "55000"
      # GitHub often has flaky access to Naver; feel free to unset.
      SKIP_NAVER: "1"

      # Optional: hybrid remote cache (leave empty if not used)
      # REMOTE_URL: ${{ secrets.REMOTE_URL }}   # e.g. public GET or signed GET to last-good recommendations.json
      # REMOTE_PUT: ${{ secrets.REMOTE_PUT }}   # signed PUT (S3/R2/GCS/Gist API) to upload latest file

      # Optional: API keys for your other steps if you integrate them later
      FMP_KEY: ${{ secrets.FMP_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      GLOBAL_BUDGET_MS: 90000
      MAX_CONCURRENCY: 2
      REQ_TIMEOUT_MS: 5000
      RETRIES: 1
      BACKOFF_BASE_MS: 400
      CIRCUIT_MAX_ERRORS: 6
      COVERAGE_MIN: 0.3

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: "Guard: no hardcoded secrets"
        shell: bash
        run: |
          set -Eeo pipefail
          # Fail on likely secret assignments in source code (exclude workflows/docs)
          if git grep -nI -E '(?i)(api[_-]?key|token|secret)\s*[:=]\s*["'\''][A-Za-z0-9_\-]{12,}["'\'']' -- \
              ':!README.md' ':!.github/workflows/**' ':!**/*.yml' ':!**/*.yaml' ':!**/*.md'; then
            echo "❌ Possible hardcoded secret detected"; exit 1
          fi
          # Fail if someone echoes secret env vars
          if git grep -nI -E 'echo\s+(\$\{?(FINNHUB_API_KEY|TWELVEDATA_API_KEY|ALPHA_VANTAGE_KEY|FMP_KEY)\}?|%(\1)%)' -- \
              ':!README.md' ':!.github/workflows/**' ':!**/*.yml' ':!**/*.yaml' ':!**/*.md'; then
            echo "❌ Attempt to echo a secret environment variable"; exit 1
          fi
          echo "✅ No hardcoded secrets found."

        - name: Setup Node
          uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
          with:
            node-version: '20'
            cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build trend-aware pools
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GLOBAL_BUDGET_MS: ${{ env.GLOBAL_BUDGET_MS }}
          MAX_CONCURRENCY: ${{ env.MAX_CONCURRENCY }}
          REQ_TIMEOUT_MS: ${{ env.REQ_TIMEOUT_MS }}
          RETRIES: ${{ env.RETRIES }}
          BACKOFF_BASE_MS: ${{ env.BACKOFF_BASE_MS }}
          CIRCUIT_MAX_ERRORS: ${{ env.CIRCUIT_MAX_ERRORS }}
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}
        run: node tools/buildPoolsTrendy.js || true

      # If you're still on single-file (fetchStockInfo.js), this just works.
      # If you split into modules, it runs src/index.js instead.
      - name: Build recommendations (deadline-aware)
        run: |
          if [ -f "src/index.js" ]; then
            echo "→ Running modular entry (src/index.js)"
            timeout 60 node src/index.js --refresh-pools --force
          else
            echo "→ Running single-file (fetchStockInfo.js)"
            timeout 60 node fetchStockInfo.js --refresh-pools --force --delay=120
          fi

      # Add a validator (from earlier) at tools/validate-recs.js
      # This will fail-fast if the JSON is incomplete.
      - name: Ensure recommendations.json
        shell: bash
        run: |
          set -euo pipefail
          validate_json () { test -s recommendations.json && jq -e . recommendations.json >/dev/null 2>&1; }
          if validate_json; then
            echo "recommendations.json valid."
          else
            echo "Rebuilding pools and recommendations..."
            node tools/buildPoolsTrendy.js || true
            node fetchStockInfo.js --refresh-pools --force
            validate_json
          fi

      - name: Verify generated files (brief)
        run: |
          test -f recommendations.json
          echo "Last updated:"
          node -e "console.log(require('./recommendations.json').lastUpdated || 'n/a')"
          echo "Mode:"
          node -e "console.log(require('./recommendations.json').mode || 'unknown')"

      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403  # v5
        with:
          commit_message: "chore: stock recommendations update [skip ci]"
          file_pattern: |
            recommendations.json
            pools.json
            pools-cache.json
            pools-metrics.json
            metrics-cache.json
            ticker-cache.json
            feedback.json
            data/market_news.json
            data/fx_rates.json
            stocks.html
            src/template.html
          add_options: '-A'
          skip_dirty_check: true

      - name: Show last commit (debug)
        if: always()
        run: git log -1 --name-only --pretty=fuller || true

      # Optional: publish to GitHub Pages if your repo uses it
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          # force_orphan: true  # uncomment if you want a clean history on gh-pages
