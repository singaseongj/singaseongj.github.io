# yamllint disable rule:line-length rule:truthy
---
name: Build & Publish Stock Recommendations

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours (cron is UTC; runs 4 times daily)
    - cron: '0 */6 * * *'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    environment:
      name: production
      url: https://singaseongj.github.io

    concurrency:
      group: daily-stock-report
      cancel-in-progress: true

    env:
      TZ: Asia/Seoul
      NODE_OPTIONS: --dns-result-order=ipv4first
      # Keep the run under typical 60s shells; script respects this.
      HARD_DEADLINE_MS: "55000"           # news deadline (now enforced)
      SKIP_NAVER: "0"
      SKIP_GDELT: "0"
      PREFER_NAVER: "1"
      NAVER_WEIGHT: "1.6"
      OTHER_NEWS_WEIGHT: "1.0"
      NAVER_BLOG_WEIGHT: "0.5"
      NAVER_REP_BONUS: "1.1"
      IS_CRON: ${{ github.event_name == 'schedule' }}
      # FX backup via Korea Eximbank (oapi.koreaexim.go.kr)
      USE_EXIM_FX_BACKUP: "1"
      EXIM_AUTH_KEY: ${{ secrets.EXIM_AUTH_KEY }}   # Exim
      # Use the portal key for KOTRA + (optionally KRX if you share it)
      DATA_API_KEY: ${{ secrets.DATA_API_KEY }}             # plain (decoded) KOTRA key (…==)
      DATA_ENCODE_KEY: ${{ secrets.DATA_ENCODE_KEY }}
      USE_KOTRA_BACKUP: "1"
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Optional: hybrid remote cache (leave empty if not used)
      # REMOTE_URL: ${{ secrets.REMOTE_URL }}   # e.g. public GET or signed GET to last-good recommendations.json
      # REMOTE_PUT: ${{ secrets.REMOTE_PUT }}   # signed PUT (S3/R2/GCS/Gist API) to upload latest file

      # API keys (make sure these are set in repo secrets)
      FMP_KEY: ${{ secrets.FMP_KEY }}
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      NEWSDATA_DATE_WINDOW_DAYS: 7
      NEWSDATA_PAGE_LIMIT: 3           # follow up to 3 nextPage tokens
      NEWSDATA_SIZE: 25                # per page; paid plans allow up to 50
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
      GNEWS_API: ${{ secrets.GNEWS_API }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      NASDAQ_API_KEY: ${{ secrets.NASDAQ_API_KEY }}
      DEEPS_API_KEY: ${{ secrets.DEEPS_API_KEY }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      COINDESK_API: ${{ secrets.COINDESK_API }}
      # Optional tuning for this module
      NEWS_CONCURRENCY: 2        # your code already defaults to 2; keep it small for SerpApi quotas
      NEWS_TTL_MS: 1800000       # 30m cache TTL (aligns with your comment)
      NAVER_TRENDS_CACHE_TTL_MS: 21600000   # 6h (matches the code)
      TAG_TARGET_COUNT: "50"
      TAG_MAX_CONSECUTIVE_429: "12"
      GLOBAL_BUDGET_MS: "90000"
      FINAL_STAGE_BUDGET_FRAC: "0.02"
      COVERAGE_MIN: "0.10"
      NEWS_MAX_SYMBOLS: "80"
      MAX_CONCURRENCY: 2
      REQ_TIMEOUT_MS: "8000"       # helps fail fast instead of hanging
      RETRIES: "2"
      BACKOFF_BASE_MS: "600"
      CIRCUIT_MAX_ERRORS: 6
      CIRCUIT_COOLDOWN_MS: 45000

    steps:
      - name: Checkout
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493  # v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify refresh-pools policy
        run: bash .github/scripts/check-refresh-pools.sh

      - name: "Guard: no hardcoded secrets"
        shell: bash
        run: |
          set -Eeo pipefail
          # Fail on likely secret assignments in source code (exclude workflows/docs)
          if git grep -nI -E '(?i)(api[_-]?key|token|secret)\s*[:=]\s*["'\''][A-Za-z0-9_\-]{12,}["'\'']' -- \
              ':!README.md' ':!.github/workflows/**' ':!**/*.yml' ':!**/*.yaml' ':!**/*.md'; then
            echo "❌ Possible hardcoded secret detected"; exit 1
          fi
          # Fail if someone echoes secret env vars
          if git grep -nI -E 'echo\s+(\$\{?(FINNHUB_API_KEY|TWELVEDATA_API_KEY|ALPHA_VANTAGE_KEY|FMP_KEY|SERP_API_KEY)\}?|%(\1)%)' -- \
              ':!README.md' ':!.github/workflows/**' ':!**/*.yml' ':!**/*.yaml' ':!**/*.md'; then
            echo "❌ Attempt to echo a secret environment variable"; exit 1
          fi
          echo "✅ No hardcoded secrets found."

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'  # ensure cache hits on the lockfile

      - name: Cache npm directory (extra safety)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache pools data
        uses: actions/cache@v4
        with:
          path: |
            cache
            data/cache
          key: pools-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Tune npm for CI
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline true
          npm config set audit false
          npm config set fund false

      - name: Authenticate npm (optional)
        shell: bash
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > ~/.npmrc
            echo "✅ npm auth configured"
          else
            echo "ℹ️ NPM_TOKEN not set; skipping npm auth"
          fi

      - name: Use temporary npm mirror (optional)
        if: ${{ vars.USE_NPM_MIRROR == '1' }}
        run: npm config set registry https://registry.npmmirror.com

      - name: Install deps (with retry)
        shell: bash
        run: |
          set -Eeuo pipefail
          tries=0
          until [ $tries -ge 5 ]; do
            if npm ci --cache ~/.npm --no-audit --fund=false --prefer-offline; then
              exit 0
            fi
            tries=$((tries+1))
            echo "npm ci failed (attempt $tries). Sleeping $((tries*10))s…"
            sleep $((tries*10))
          done
          echo "npm ci failed after retries."
          exit 1

      - name: Run ESM smoke tests (non-blocking)
        shell: bash
        run: |
          node --version
          node --test tests/*.test.js || echo "No tests or tests failed — continuing"

      - name: Build index ticker maps
        run: node tools/updateIndexMaps.mjs
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}

      # 🔹 Build news & trend caches first (writes data/news-features.json, data/naver-trends.json)
      - name: Build news/trend caches (features first)
        env:
          NEWS_FEATURES_FILE: data/news-features.json
          NAVER_TRENDS_FILE: data/naver-trends.json
          GLOBAL_BUDGET_MS: ${{ env.GLOBAL_BUDGET_MS }}
          NAVER_TRENDS_CACHE_TTL_MS: ${{ env.NAVER_TRENDS_CACHE_TTL_MS }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GNEWS_API: ${{ secrets.GNEWS_API }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          NEWSDATA_DATE_WINDOW_DAYS: ${{ env.NEWSDATA_DATE_WINDOW_DAYS }}
          NEWSDATA_PAGE_LIMIT: ${{ env.NEWSDATA_PAGE_LIMIT }}
          NEWSDATA_SIZE: ${{ env.NEWSDATA_SIZE }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DEEPS_API_KEY: ${{ secrets.DEEPS_API_KEY }}
        run: |
          set -euo pipefail
          node src/news/fetchByTicker.js --build-caches
          test -s data/news-features.json
          test -s data/naver-trends.json

      - name: Commit updated tag corpus
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f stocks/data/tags.json ]; then
            echo "tags.json not found; skipping commit"
            exit 0
          fi

          if ! git status --short -- stocks/data/tags.json | grep -q 'stocks/data/tags.json'; then
            echo "No tag updates detected"
            exit 0
          fi

          branch="${GITHUB_REF#refs/heads/}"
          branch=${branch:-main}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch"
          git pull --rebase origin "$branch"
          git add stocks/data/tags.json
          git commit -m "chore: update market tags"
          git push origin "HEAD:$branch"

      - name: "Preflight: DeepSearch"
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -4sS -I https://api-v2.deepsearch.com | head -n 1
          curl -4sS --get 'https://api-v2.deepsearch.com/v1/global-articles' \
            -H "Authorization: Bearer ${DEEPS_API_KEY}" \
            --data-urlencode 'page_size=1' \
            -o /dev/null -w 'HTTP %{http_code}\n'

      - name: Build trend-aware pools
        env:
          USE_PREBUILT_FEATURES: "1"              # ← read-only: reuse the files we just built
          NEWS_FEATURES_FILE: data/news-features.json
          NAVER_TRENDS_FILE: data/naver-trends.json
          FMP_KEY: ${{ secrets.FMP_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DEEPS_API_KEY: ${{ secrets.DEEPS_API_KEY }}
          GLOBAL_BUDGET_MS: ${{ env.GLOBAL_BUDGET_MS }}
          MAX_CONCURRENCY: ${{ env.MAX_CONCURRENCY }}
          REQ_TIMEOUT_MS: ${{ env.REQ_TIMEOUT_MS }}
          RETRIES: ${{ env.RETRIES }}
          BACKOFF_BASE_MS: ${{ env.BACKOFF_BASE_MS }}
          CIRCUIT_MAX_ERRORS: ${{ env.CIRCUIT_MAX_ERRORS }}
          CIRCUIT_COOLDOWN_MS: ${{ env.CIRCUIT_COOLDOWN_MS }}
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}
          UNIVERSE_LIMIT: 200
        run: |
          set -euo pipefail
          node tools/buildPoolsTrendy.js

      - name: Build recommendations (no pool refresh here)
        shell: bash
        env:
          GNEWS_API: ${{ secrets.GNEWS_API }}
        run: |
          set -euo pipefail
          if [ -f fetchStockInfo.js ]; then
            # No --refresh-pools here, because we already ran buildPoolsTrendy.js
            timeout 60 node fetchStockInfo.js --force --delay=120
          elif [ -f src/index.js ]; then
            echo "Running modular entry (src/index.js)"
            timeout 60 node src/index.js --force
          else
            echo "No entrypoint found"; exit 1
          fi

      - name: Ensure recommendations.json
        shell: bash
        run: |
          set -euo pipefail
          validate_json () { test -s recommendations.json && jq -e . recommendations.json >/dev/null 2>&1; }
          if validate_json; then
            echo "recommendations.json valid."
          else
            echo "Rebuilding recommendations (pools already built this run)..."
            # Prefer the enhanced path first (multi-source quotes); fall back to legacy
            node fetchStockInfo.js --force --enhanced || node fetchStockInfo.js --force
            validate_json
          fi

      - name: Fetch price returns
        run: node fetchReturns.js

      # ⬇️ Added from daily-build.yml
      - name: "Preflight: outbound connectivity (SerpApi/GDELT)"
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DNS:"
          getent hosts serpapi.com || true
          getent hosts api.gdeltproject.org || true

          echo "HTTP head checks:"
          curl -4sS -I https://serpapi.com | head -n 1
          if ! curl -4sS -I https://api.gdeltproject.org | head -n 1; then
            echo "GDELT head check failed; setting SKIP_GDELT=1"
            echo "SKIP_GDELT=1" >> "$GITHUB_ENV"
          fi

          echo "SerpApi auth check (status only; key masked by Actions):"
          curl -4sS --get 'https://serpapi.com/search.json' \
            --data-urlencode 'engine=google_news' \
            --data-urlencode 'q=TSLA' \
            --data-urlencode 'gl=us' \
            --data-urlencode 'hl=en' \
            --data-urlencode "api_key=${SERP_API_KEY}" \
            -o /dev/null -w 'HTTP %{http_code}\n'

      - name: "Preflight: NewsData.io"
        shell: bash
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: |
          set -Eeuo pipefail
          curl -4sS -I https://newsdata.io | head -n 1
          curl -4sS --get 'https://newsdata.io/api/1/latest' \
            --data-urlencode "apikey=${NEWSDATA_API_KEY}" \
            --data-urlencode "q=tesla" \
            --data-urlencode "language=en" \
            --data-urlencode "timeframe=6" \
            -o /dev/null -w 'HTTP %{http_code}\n'

      - name: Update market news
        shell: bash
        run: |
          set -Eeuo pipefail
          node fetchNews.js
          test -s data/market-news.json
          echo "market_news lastUpdated:"
          node -e "console.log(require('./data/market-news.json').lastUpdated || 'missing')"
          echo "--- git status/diff (market_news) ---"
          git status --porcelain -- data/market-news.json || true
          git --no-pager diff -- data/market-news.json | sed -n '1,80p' || true

      - name: Update FX rates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p stocks/fx_rates
          node fetchFxRates.js
          test -s stocks/fx_rates/fx_rates.json
          test -s stocks/fx_rates/fx_history.json
          echo "fx_rates lastUpdated:"
          node -e "console.log(require('./stocks/fx_rates/fx_rates.json').lastUpdated || 'missing')"
          echo "--- git status/diff (fx_rates) ---"
          git status --porcelain -- stocks/fx_rates || true
          git --no-pager diff -- stocks/fx_rates | sed -n '1,80p' || true

      - name: "Verify generated files (brief)"
        run: |
          test -f recommendations.json
          echo "Last updated:"
          node -e "console.log(require('./recommendations.json').lastUpdated || 'n/a')"
          echo "Mode:"
          node -e "console.log(require('./recommendations.json').mode || 'unknown')"

      - name: Build news summary
        run: node summarize-news.js

      - name: Build article cache
        run: node build-articles.js

      - name: Build significance-based keyword snapshot
        env:
          MARKET_TAG_FILE: stocks/data/tags.json
        run: |
          set -Eeuo pipefail
          node src/news/fetchByTicker.js --significant-phrases
          test -s stocks/data/tags.json

      - name: Verify market tag snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -s stocks/data/tags.json ]; then
            echo "stocks/data/tags.json missing or empty; skipping verification"
            exit 0
          fi
          echo "tags.json generatedAt:"
          jq -r '.metadata.generated_at // .metadata.generatedAt // .generated_at // .generatedAt // "missing"' stocks/data/tags.json
          echo "tags.json total tags:"
          jq -r '.total_phrases // .total // (.discovered_keywords | length) // "missing"' stocks/data/tags.json

      - name: Prune cache directory
        env:
          CACHE_LIMIT: 1000
        run: node tools/prune-cache.js

      - name: Stage new data files
        shell: bash
        run: |
          set -Eeuo pipefail
          paths=(
            data/market-news.json
            data/news-features.json
            data/naver-trends.json
            summary.json
            summary.md
            data/articles
            pools-metrics.json
            recommendations.json
            ticker-cache.json
            pools.json
            pools-cache.json
            cache
            stocks/fx_rates/fx_rates.json
            stocks/fx_rates/fx_history*.json
            stocks/fx_rates/index.html
            stocks/data/tags.json
          )
          staged_any=0
          for path in "${paths[@]}"; do
            matches=( $path )
            for match in "${matches[@]}"; do
              if [ -e "$match" ] || [ -L "$match" ]; then
                git add "$match"
                staged_any=1
              else
                echo "Skipping missing path: $match"
              fi
            done
          done
          if [ "$staged_any" -eq 1 ]; then
            echo "Files staged for commit"
          else
            echo "No files staged"
          fi

      - name: Commit & push changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: data update (news/fx/summary) [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Verify HEAD has fresh data
        if: always()
        run: |
          echo "market_news HEAD lastUpdated:"
          git show HEAD:data/market-news.json | jq -r .lastUpdated
          echo "fx_rates HEAD lastUpdated (stocks/fx_rates):"
          git show HEAD:stocks/fx_rates/fx_rates.json | jq -r .lastUpdated
          echo "history HEAD lastUpdated:"
          git show HEAD:stocks/fx_rates/fx_history.json | jq -r .lastUpdated
          manifest_tmp="$(mktemp)"
          git show HEAD:stocks/fx_rates/fx_history_manifest.json > "$manifest_tmp"
          echo "fx_history manifest HEAD files:"
          jq -r '.files[]?' "$manifest_tmp"
          echo "fx_history HEAD per-file updatedAt values:"
          jq -r '.files[]?' "$manifest_tmp" | while read -r file; do
            [ -n "$file" ] || continue
            echo "$file updatedAt:"
            git show HEAD:stocks/fx_rates/"$file" | jq -r '.updatedAt // .lastUpdated // "missing"'
          done
          rm -f "$manifest_tmp"

      - name: "Show last commit (debug)"
        if: always()
        run: git log -1 --name-only --pretty=fuller || true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          # force_orphan: true  # uncomment if you want a clean history on gh-pages
