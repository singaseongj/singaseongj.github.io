---
name: Daily Stock Report Build

# KST 오전 9시 → UTC 오전 0시 (cron은 UTC 기준)
on:
  schedule:
    # 매 6시간마다 실행 (UTC 기준)
    - cron: '0 */6 * * *'

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 의존성 설치
        run: npm ci

      - name: 주식 추천 정보 업데이트
        run: node fetchStockInfo.js

      - name: 뉴스 데이터 업데이트
        run: node fetchNews.js

      - name: 빌드 실행
        run: npm run build

      - name: 변경된 파일 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: daily stock report update [skip ci]"
          file_pattern: |
            stocks.html
            src/template.html
            data/market_news.json
            recommendations.json
          skip_dirty_check: true

      - name: GitHub Pages 배포
        # gh-pages 브랜치를 사용 중이라면 branch 지정
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
