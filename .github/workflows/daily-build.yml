# yamllint disable rule:line-length
---
name: Daily Stock Report Build

'on':
  workflow_dispatch:
  schedule:
    - cron: '0 1,6,11,15,20 * * *'  # 00/05/10/15/20 KST
jobs:
  build-and-deploy:
    environment:
      name: production
      url: https://singaseongj.github.io
    permissions:
      contents: write
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul  # make timestamps consistent with KST
      FMP_KEY: ${{ secrets.FMP_KEY }}                 # optional
      ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}  # optional
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}         # optional
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}   # optional
      GLOBAL_BUDGET_MS: 90000
      MAX_CONCURRENCY: 2
      REQ_TIMEOUT_MS: 5000
      RETRIES: 1
      BACKOFF_BASE_MS: 400
      CIRCUIT_MAX_ERRORS: 6
      COVERAGE_MIN: 0.3

    concurrency:
      group: daily-stock-report
      cancel-in-progress: false

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: "Guard: no secrets in code/logs"
        shell: bash
        run: |
          set -e
          echo "== scanning for hardcoded secrets =="
          pattern_assign='(api|token|secret)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_-]{12,}["'"'"']'
          pattern_echo='echo[[:space:]]+.*\$\{?(FINNHUB_API_KEY|TWELVEDATA_API_KEY|ALPHA_VANTAGE_KEY|FMP_KEY)\}?'
          if grep -RInE "$pattern_assign" \
              --exclude-dir=.git \
              --exclude-dir=workflows \
              --exclude=README \
              --exclude=*.md \
              --exclude=*.yml \
              --exclude=*.yaml .; then
            echo '❌ Hardcoded secret detected'
            exit 1
          fi
          if grep -RInE "$pattern_echo" \
              --exclude-dir=.git \
              --exclude-dir=workflows \
              --exclude=README \
              --exclude=*.md \
              --exclude=*.yml \
              --exclude=*.yaml .; then
            echo '❌ Echoing secret env vars detected'
            exit 1
          fi
          echo '✅ no secrets found'

      - name: "Guard: no env/key files"
        run: |
          set -e
          ! git ls-files | grep -E '\.env(\..*)?$|\.pem$|\.key$|_creds\.|credentials\.json$' || (echo '❌ remove secret files'; exit 1)

      - name: Node.js 설정
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      # Keep lockfile in sync with package.json (we removed node-fetch/proxy)
      - name: Sync lockfile with package.json
        run: npm install --package-lock-only

      - name: 의존성 설치
        run: npm ci

      # Guardrail: fail fast if legacy imports reappear
      - name: "Assert no legacy imports (node-fetch / https-proxy-agent)"
        run: |
          set -e
          ! grep -nE 'node-fetch|https-proxy-agent' fetchStockInfo.js || (echo '❌ Remove node-fetch/https-proxy-agent imports from fetchStockInfo.js' && exit 1)
          ! grep -nE 'node-fetch|https-proxy-agent' fetchNews.js || (echo '❌ Remove node-fetch/https-proxy-agent imports from fetchNews.js' && exit 1)
        shell: bash

      - name: Build trend-aware pools
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GLOBAL_BUDGET_MS: ${{ env.GLOBAL_BUDGET_MS }}
          MAX_CONCURRENCY: ${{ env.MAX_CONCURRENCY }}
          REQ_TIMEOUT_MS: ${{ env.REQ_TIMEOUT_MS }}
          RETRIES: ${{ env.RETRIES }}
          BACKOFF_BASE_MS: ${{ env.BACKOFF_BASE_MS }}
          CIRCUIT_MAX_ERRORS: ${{ env.CIRCUIT_MAX_ERRORS }}
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}
        run: node tools/buildPoolsTrendy.js || true

      - name: "Build recommendations (primary path)"
        run: node fetchStockInfo.js --refresh-pools --force

      - name: 뉴스 데이터 업데이트
        run: node fetchNews.js

      - name: 환율 데이터 업데이트
        run: node fetchFxRates.js

      - name: "Verify generated files (enhanced)"
        run: |
          set -e
          echo "== list files ==" && ls -la
          echo "== check targets exist =="
          test -f data/market_news.json && echo "✅ data/market_news.json OK" || (echo '❌ missing'; exit 1)
          test -f recommendations.json && echo "✅ recommendations.json OK" || (echo '❌ missing'; exit 1)
          test -f data/fx_rates.json && echo "✅ data/fx_rates.json OK" || (echo '❌ missing'; exit 1)

          echo "== show lastUpdated =="
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/market_news.json','utf8'));console.log('market_news lastUpdated:', d.lastUpdated)"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('recommendations.json','utf8'));console.log('recommendations lastUpdated:', d.lastUpdated)"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/fx_rates.json','utf8'));console.log('fx base:', d.base, 'updated:', d.timestamp, 'KRW:', d.rates?.KRW)"

          echo "== git status & diff =="
          git status
          git diff --name-only
          git diff -- data/market_news.json || true
          git diff -- recommendations.json || true

          echo "== first few lines of files =="
          head -n 5 data/market_news.json || true
          head -n 5 recommendations.json || true

      - name: "Stage changes (pre-commit)"
        run: |
          git add -A
          git status
          git diff --staged --name-only || true

      - name: Commit & push changes
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: daily stock report update [skip ci]"
          file_pattern: |
            package.json
            package-lock.json
            recommendations.json
            pools.json
            pools-cache.json
            pools-metrics.json
            ticker-cache.json
            feedback.json
            data/market_news.json
            data/fx_rates.json
            stocks.html
            src/template.html
          add_options: '-A'
          skip_dirty_check: true

      - name: "Show last commit (debug)"
        if: always()
        run: git log -1 --name-only --pretty=fuller || true

      - name: GitHub Pages 배포
        if: steps.auto_commit.outputs.changes_detected == 'true'
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          # force_orphan: true  # optional
