name: Daily Stock Report Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours (UTC)

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul  # make timestamps consistent with KST

    concurrency:
      group: daily-stock-report
      cancel-in-progress: false

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Keep lockfile in sync with package.json (we removed node-fetch/proxy)
      - name: Sync lockfile with package.json
        run: npm install --package-lock-only

      - name: 의존성 설치
        run: npm ci

      # Guardrail: fail fast if legacy imports reappear
      - name: Assert no legacy imports (node-fetch / https-proxy-agent)
        run: |
          set -e
          ! grep -nE "node-fetch|https-proxy-agent" fetchStockInfo.js || (echo "❌ Remove node-fetch/https-proxy-agent imports from fetchStockInfo.js" && exit 1)
          ! grep -nE "node-fetch|https-proxy-agent" fetchNews.js || (echo "❌ Remove node-fetch/https-proxy-agent imports from fetchNews.js" && exit 1)
        shell: bash

      - name: 주식 추천 정보 업데이트
        run: node fetchStockInfo.js

      - name: 뉴스 데이터 업데이트
        run: node fetchNews.js

      - name: Verify generated files
        run: |
          ls -la
          test -f data/market_news.json && echo "✅ data/market_news.json OK" || (echo "❌ data/market_news.json missing"; exit 1)
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/market_news.json','utf8'));console.log('market_news lastUpdated:',d.lastUpdated)"
          test -f recommendations.json && echo "✅ recommendations.json OK" || (echo "❌ recommendations.json missing"; exit 1)

      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily stock report update [skip ci]"
          file_pattern: |
            package.json
            package-lock.json
            recommendations.json
            ticker-cache.json
            data/market_news.json
            stocks.html
            src/template.html

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          # force_orphan: true  # optional
