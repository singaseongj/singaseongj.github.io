name: Daily Stock Report Build

on:
  # Enable manual runs from the GitHub UI
  workflow_dispatch:

  # KST 오전 9시 → UTC 오전 0시 (cron은 UTC 기준)
  schedule:
    # 매 6시간마다 실행 (UTC 기준)
    - cron: '0 */6 * * *'

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 의존성 설치
        run: npm ci

      - name: 주식 추천 정보 업데이트
        run: node fetchStockInfo.js

      - name: 뉴스 데이터 업데이트
        run: node fetchNews.js

      - name: 빌드 실행
        run: npm run build

      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "chore: daily stock report update [skip ci]"
          file_pattern: |
            stocks.html
            src/template.html
            data/market_news.json
            recommendations.json
          skip_dirty_check: true

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
