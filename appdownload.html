<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students App Download</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .download-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Download Manage Students App</h1>
    <p>Get the best experience on your device</p>
    
    <div class="download-buttons" id="download-links">
        <!-- Links will be dynamically populated -->
    </div>

    <script>
        function detectDevice() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            
            // Detailed device and OS detection
            return {
                isIOS: /iPad|iPhone|iPod/.test(ua) && !window.MSStream,
                isAndroid: /Android/.test(ua),
                isWindows: /Win/.test(ua),
                isMac: /Mac/.test(ua),
                isLinux: /Linux/.test(ua)
            };
        }

        function createDownloadLinks() {
            // Specific app store links
            const links = {
                appStore: 'https://apps.apple.com/kr/app/manage-students/id6742710838',
                playStore: 'https://play.google.com/store/apps/details?id=com.singaseongapp.managestudents'
            };

            const device = detectDevice();
            const downloadLinksContainer = document.getElementById('download-links');

            // Clear any existing links
            downloadLinksContainer.innerHTML = '';

            // Create download links based on device
            if (device.isIOS) {
                addDownloadLink(downloadLinksContainer, links.appStore, 'App Store');
            }

            if (device.isAndroid) {
                addDownloadLink(downloadLinksContainer, links.playStore, 'Google Play');
            }

            // Always add both download options
            if (downloadLinksContainer.children.length === 0) {
                addDownloadLink(downloadLinksContainer, links.appStore, 'App Store');
                addDownloadLink(downloadLinksContainer, links.playStore, 'Google Play');
            }
        }

        function addDownloadLink(container, url, storeName) {
            const link = document.createElement('a');
            link.href = url;
            link.textContent = `Download on ${storeName}`;
            link.className = 'download-btn';
            container.appendChild(link);
        }

        // Call the function when the page loads
        window.onload = createDownloadLinks;
    </script>
    
    <noscript>
        <p>Please download our app from:</p>
        <div class="download-buttons">
            <a href="https://apps.apple.com/kr/app/manage-students/id6742710838" class="download-btn">App Store</a>
            <a href="https://play.google.com/store/apps/details?id=com.singaseongapp.managestudents" class="download-btn">Google Play</a>
        </div>
    </noscript>
</body>
</html>
