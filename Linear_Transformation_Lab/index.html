<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D / 3D Toggle</title>
  <script src="./plotly-latest.min.js"></script>
</head>
<body>
  <button onclick="draw2D()">Switch to 2D</button>
  <button onclick="draw3D()">Switch to 3D</button>
  <div id="plot" style="width:700px; height:600px;"></div>

  <script>
    function draw2D() {
      let trace2D = {
        x: [0, 2],
        y: [0, 3],
        mode: 'lines+markers',
        type: 'scatter',
        line: {width: 3, color: 'blue'},
        marker: {size: 8, color: 'red'}
      };

      let layout2D = {
        title: '2D Vector (2,3)',
        xaxis: {title: 'X'},
        yaxis: {title: 'Y'}
      };

      Plotly.newPlot('plot', [trace2D], layout2D);
    }

    function draw3D() {
      let trace3D = {
        x: [0, 2],
        y: [0, 3],
        z: [0, 5],
        mode: 'lines+markers',
        type: 'scatter3d',
        line: {width: 6, color: 'green'},
        marker: {size: 5, color: 'red'}
      };

      let layout3D = {
        title: '3D Vector (2,3,5)',
        scene: {
          xaxis: {title: 'X'},
          yaxis: {title: 'Y'},
          zaxis: {title: 'Z'}
        }
      };

      Plotly.newPlot('plot', [trace3D], layout3D);
    }

    draw2D();
  </script>
</body>
</html>
